name: Build4Fun checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r apps/build4fun/tests/requirements.txt
      - run: python -m unittest discover -s apps/build4fun/tests -v
      - run: python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .venv/browsers
      - run: python apps/build4fun/tests/ui_smoke.py
      - run: python apps/build4fun/tests/docker_integration.py --run
      - run: docker build -t build4fun-local-check .
      - run: python apps/build4fun/tests/container_smoke.py
  code4fun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/code4fun/workspace/requirements.txt
      - run: python -m unittest discover -s apps/code4fun/tests -v
      - run: python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .venv/browsers
      - run: python apps/code4fun/tests/ui_smoke.py
        env:
          PLAYWRIGHT_BROWSERS_PATH: .venv/browsers
      - run: python apps/code4fun/tests/container_smoke.py
