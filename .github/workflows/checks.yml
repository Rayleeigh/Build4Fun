name: Build4Fun checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r src/tests/requirements.txt
      - run: python -m unittest discover -s src/tests -v
      - run: python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .venv/browsers
      - run: python src/tests/ui_smoke.py
      - run: python src/tests/docker_integration.py --run
      - run: docker build -t build4fun-local-check .
      - run: python src/tests/container_smoke.py
