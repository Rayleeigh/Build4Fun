name: Build4Fun checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose -f compose.build4fun.yaml config --quiet
      - run: python -m pip install -r apps/build4fun/requirements.txt -r apps/build4fun/tests/requirements.txt
      - run: python -m unittest discover -s apps/build4fun/tests -v
      - run: python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .venv/browsers
      - run: python apps/build4fun/tests/ui_smoke.py
      - run: python apps/build4fun/tests/docker_integration.py --run
      - run: docker build -f apps/build4fun/Dockerfile -t build4fun-local-check .
      - run: python apps/build4fun/tests/container_smoke.py
  code4fun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose -f compose.code4fun.yaml config --quiet
      - run: python -m pip install -r apps/code4fun/workspace/requirements.txt
      - run: python -m unittest discover -s apps/code4fun/tests -v
      - run: python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .venv/browsers
      - run: python apps/code4fun/tests/ui_smoke.py
        env:
          PLAYWRIGHT_BROWSERS_PATH: .venv/browsers
      - run: python apps/code4fun/tests/container_smoke.py
  crack4fun:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose -f compose.crack4fun.yaml config --quiet
      - run: python -m unittest discover -s apps/crack4fun/tests -v
      - run: python -m pip install -r apps/build4fun/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python apps/crack4fun/tests/container_smoke.py
