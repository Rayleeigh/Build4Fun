name: Release 4Fun images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version image tag (for example v1.2.3)'
        required: true
        type: string
      publish_latest:
        description: 'Also update latest for all seven images'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
      repository: ${{ steps.release.outputs.repository }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release settings
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_LATEST: ${{ inputs.publish_latest }}
        run: |
          python - <<'PYTHON'
          import os, re, subprocess
          manual = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          version = os.environ['MANUAL_VERSION'] if manual else os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[A-Za-z0-9_.-]{0,127}', version):
              raise SystemExit('Use a Docker version tag starting with v, up to 128 characters.')
          latest = os.environ['MANUAL_LATEST'] == 'true' if manual else os.environ['PRERELEASE'] != 'true'
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
              output.write('publish_latest=' + str(latest).lower() + '\n')
              output.write('repository=ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower() + '\n')
              output.write('revision=' + revision + '\n')
          PYTHON

  validate-build4fun:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_IMAGE: build4fun-release-check:${{ github.run_id }}-${{ github.run_attempt }}
      TEST_CONTAINER: build4fun-release-check
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the release image
        run: |
          docker build --file apps/build4fun/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${{ needs.prepare.outputs.version }}" \
            --tag "$TEST_IMAGE" .

      - name: Host the image for testing
        run: |
          docker run --detach --name "$TEST_CONTAINER" \
            --publish 127.0.0.1:8080:8080 "$TEST_IMAGE"

      - name: Check the running application's HTTP endpoints
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          base = 'http://127.0.0.1:8080'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base, timeout=2) as response:
                      assert response.status == 200
                      assert 'Build4Fun' in response.read().decode()
                  break
              except (OSError, urllib.error.URLError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          with urllib.request.urlopen(base + '/api/projects', timeout=5) as response:
              assert json.load(response) == []
          with urllib.request.urlopen(base + '/api/definitions', timeout=5) as response:
              assert 'service' in json.load(response)
          print('Published port, application startup, and HTTP API checks passed.')
          PY

      - name: Install test dependencies
        run: python -m pip install -r apps/build4fun/requirements.txt -r apps/build4fun/tests/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s apps/build4fun/tests -v

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Run browser regression checks
        run: python apps/build4fun/tests/ui_smoke.py

      - name: Run Docker lifecycle checks
        run: python apps/build4fun/tests/docker_integration.py --run

      - name: Validate the built image
        run: python apps/build4fun/tests/container_smoke.py --image "$TEST_IMAGE"

      - name: Show application logs on failure
        if: failure()
        run: docker logs "$TEST_CONTAINER" || true

      - name: Remove the test container
        if: always()
        run: docker rm --force "$TEST_CONTAINER" || true

  validate-addons:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/build4fun/tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s apps/code4fun/tests -v
      - run: python -m unittest discover -s apps/crack4fun/tests -v
      - run: python -m unittest discover -s apps/launcher/tests -v
      - run: python apps/launcher/tests/ui_smoke.py
      - run: python apps/launcher/tests/docker_smoke.py
      - run: python apps/code4fun/tests/container_smoke.py
      - run: python apps/crack4fun/tests/container_smoke.py

  publish:
    name: Publish ${{ matrix.image }}
    needs: [prepare, validate-build4fun, validate-addons]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: build4fun
            suffix: ''
            dockerfile: apps/build4fun/Dockerfile
            context: .
          - image: code4fun-workspace
            suffix: /code4fun-workspace
            dockerfile: apps/code4fun/Dockerfile
            context: .
          - image: code4fun-api
            suffix: /code4fun-api
            dockerfile: apps/code4fun/api/Dockerfile
            context: apps/code4fun/api
          - image: crack4fun-workspace
            suffix: /crack4fun-workspace
            dockerfile: apps/crack4fun/Dockerfile
            context: .
          - image: crack4fun-sandbox
            suffix: /crack4fun-sandbox
            dockerfile: apps/crack4fun/sandbox/Dockerfile
            context: .
          - image: crack4fun-portal
            suffix: /crack4fun-portal
            dockerfile: apps/crack4fun/portal/Dockerfile
            context: .
          - image: launcher
            suffix: /launcher
            dockerfile: apps/launcher/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tags
        id: tags
        env:
          IMAGE: ${{ needs.prepare.outputs.repository }}${{ matrix.suffix }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          python - <<'PYTHON'
          import os
          tags = [os.environ['IMAGE'] + ':' + os.environ['VERSION']]
          if os.environ['PUBLISH_LATEST'] == 'true':
              tags.append(os.environ['IMAGE'] + ':latest')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tags<<IMAGE_TAGS\n' + '\n'.join(tags) + '\nIMAGE_TAGS\n')
          PYTHON
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
