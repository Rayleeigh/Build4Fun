<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crack4Fun · Workspace</title><link rel="stylesheet" href="/vendor/xterm.css"><link rel="stylesheet" href="/style.css"><script src="/vendor/xterm.js" defer></script><script src="/app.js" defer></script></head><body>
<div class="shell"><aside class="sidebar"><a class="brand" href="/">Crack<span>4</span>Fun</a><p class="sidebar-label">Programs</p><nav id="programs" aria-label="CTF programs"></nav><p class="sidebar-note">Crack the clues.<br>One investigation at a time.</p><div class="sidebar-bottom">Local learning environment</div></aside>
<div class="work-area"><header class="toolbar"><button id="menu" class="quiet" aria-label="Toggle programs">☰</button><span>Workspace</span><div class="toolbar-actions"><button id="tutorial" class="quiet">Tutorial</button><button id="restore" class="secondary">Restore files</button><button id="clear-progress" class="quiet danger">Clear progress</button></div></header><main><div class="heading"><div><p id="difficulty"></p><h1 id="program-title">Loading programs…</h1></div><div class="progress"><span id="progress-count">0/0</span><progress id="progress" max="1" value="0" aria-label="Program completion"></progress></div></div><p id="description"></p><div class="workspace"><section class="panel mission"><div class="panel-header">Challenges <span id="challenge-count"></span></div><nav id="challenges" aria-label="Program challenges"></nav><div class="mission-body"><h2 id="task-title"></h2><p id="goal"></p><p class="start-label">Start here</p><code id="start"></code><details id="downloads" hidden><summary>Download evidence</summary><div id="download-links"></div></details><details><summary>Need a hint?</summary><div id="hints"></div><button id="hint" class="quiet">Show next hint</button></details><form id="flag-form"><label for="flag">Found a flag?</label><input id="flag" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="{your_flag_here}" maxlength="160"><button id="submit" class="primary">Submit flag</button><p id="feedback" role="status"></p></form></div></section><section class="panel lab"><div class="panel-header"><div class="views"><button id="terminal-view" aria-pressed="true">Terminal</button><button id="portal-view" hidden aria-pressed="false">Portal</button></div><span id="connection" role="status">Preparing…</span><button id="restart-terminal" class="quiet">Restart terminal</button></div><div id="terminal-area"></div><iframe id="portal" title="Apprentice Portal website" sandbox="allow-scripts allow-same-origin" hidden></iframe><div class="lab-footer"><span id="lab-note">Your terminal belongs only to this program.</span><button id="prepare" class="quiet" hidden>Prepare / Retry</button></div></section></div><p id="notice" role="status" aria-live="polite"></p></main></div></div><aside id="toast" role="status" hidden><strong>Flag accepted.</strong><p>Progress saved.</p><div></div></aside>
<dialog id="tour" aria-labelledby="tour-title" aria-describedby="tour-text">
<div id="tour-spotlight" hidden aria-hidden="true"></div>
<section id="tour-card"><header><span id="tour-count"></span><button id="tour-skip" class="quiet">Skip tutorial</button></header>
<div id="tour-content"><p id="tour-label"></p><h2 id="tour-title"></h2><p id="tour-text"></p><div id="tour-example" hidden><pre><code id="tour-code"></code></pre><p id="tour-caption"></p></div><div id="tour-topics" hidden></div></div>
<p id="tour-error" role="status"></p><footer><button id="tour-back" class="quiet">Back</button><button id="tour-next" class="primary">Next</button></footer></section>
</dialog></body></html>
