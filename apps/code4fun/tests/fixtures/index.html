<!doctype html><html><head><title>Server dashboard</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body>
<h1>My Server Dashboard</h1><p>Explore the server that powers this page.</p>
<button id="theme-toggle">Switch theme</button><button id="greet">Say hello</button><p id="message">Ready</p>
<section id="server-info"><h2>Server information</h2><dl>
<dt>User</dt><dd id="username"></dd><dt>Hostname</dt><dd id="hostname"></dd><dt>Addresses</dt><dd id="addresses"></dd>
<dt>CPU (%)</dt><dd id="cpu"></dd><dt>Memory (bytes)</dt><dd id="memory"></dd><dt>Limit (bytes)</dt><dd id="memory-limit"></dd><dt>Uptime (seconds)</dt><dd id="uptime"></dd>
</dl><button id="refresh">Refresh readings</button><p id="status" aria-live="polite"></p></section>
</body></html>
