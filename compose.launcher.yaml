name: fourfun-launcher
services:
  launcher:
    build:
      context: .
      dockerfile: apps/launcher/Dockerfile
    image: fourfun-launcher:local
    ports:
      - "127.0.0.1:${LAUNCHER_HTTP_PORT:-8070}:8070"
    environment:
      LAUNCHER_REPOSITORY: ${PWD}
      LAUNCHER_HTTP_PORT: ${LAUNCHER_HTTP_PORT:-8070}
      FOURFUN_REGISTRY: ${FOURFUN_REGISTRY:-ghcr.io/rayleeigh/educate4fun}
      B4F_HOST_WORKSPACE: ${B4F_HOST_WORKSPACE:-${PWD}/.workspace}
      B4F_DOCKER_SOCKET: ${B4F_DOCKER_SOCKET:-/var/run/docker.sock}
    volumes:
      - type: bind
        source: ${PWD}
        target: ${PWD}
        read_only: true
      - type: bind
        source: ${B4F_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - launcher-state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8070/api/state',headers={'Host':'127.0.0.1:'+os.environ.get('LAUNCHER_HTTP_PORT','8070')}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    init: true
    pids_limit: 128
volumes:
  launcher-state:
