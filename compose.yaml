name: build4fun
services:
  app:
    build: .
    image: build4fun:local
    ports:
      - "127.0.0.1:${B4F_HTTP_PORT:-8080}:8080"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      B4F_HOST_WORKSPACE: ${B4F_HOST_WORKSPACE:-${PWD}/.workspace}
      B4F_PUBLIC_PORT: ${B4F_HTTP_PORT:-8080}
    volumes:
      - type: bind
        source: ${B4F_HOST_WORKSPACE:-${PWD}/.workspace}
        target: /workspace
        bind:
          create_host_path: true
      - type: bind
        source: ${B4F_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/projects', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
