name: code4fun
services:
  workspace:
    build:
      context: .
      dockerfile: apps/code4fun/Dockerfile
    ports:
      - "127.0.0.1:${C4F_HTTP_PORT:-8090}:8090"
      - "127.0.0.1:${C4F_PREVIEW_PORT:-8091}:8091"
    environment:
      C4F_HTTP_PORT: ${C4F_HTTP_PORT:-8090}
      C4F_PREVIEW_PORT: ${C4F_PREVIEW_PORT:-8091}
      C4F_API_URL: http://api:8092
    volumes:
      - code4fun-workspace:/workspace
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1536m
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/code4fun/api/project', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
  api:
    build: apps/code4fun/api
    hostname: code4fun-api
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/api/info', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
volumes:
  code4fun-workspace:
